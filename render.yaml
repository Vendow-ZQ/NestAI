services:
  - type: web
    name: nestai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: UPLOAD_DIR
        value: uploads
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: nestai-uploads
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODELS
        value: gpt-4o,gpt-4o-mini
      - key: OPENAI_TYPE
        value: openai
      - key: DEFAULT_LLM_PROVIDER
        value: OPENAI
      - key: VISION_LLM_PROVIDER
        value: OPENAI
      - key: VISION_LLM_MODEL
        value: gpt-4o
      - key: IMAGE_PROVIDER
        value: OPENAI
      - key: IMAGE_MODEL
        value: gpt-image-1.5
      - key: IMAGE_OUTPUT_FORMAT
        value: png
      - key: IMAGE_SIZE
        value: auto
      - key: IMAGE_QUALITY
        value: medium
